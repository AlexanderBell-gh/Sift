name = "siftapi"
main = "index.js"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = false
logs = { enabled = false, head_sampling_rate = 1, persist = false, invocation_logs = false }
traces = { enabled = false, persist = false, head_sampling_rate = 1 }

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "sift"
database_id = "601b7383-8298-427d-8de7-68b2a77ffe79"
migrations_dir = "migrations"

# Secrets must be set via CLI (never commit plaintext):
#   pnpm exec wrangler secret put ADMIN_SECRET
#   pnpm exec wrangler secret put JWT_SECRET
#   pnpm exec wrangler secret put GOOGLE_CLIENT_ID

[triggers]
crons = ["0 6 * * *"]
